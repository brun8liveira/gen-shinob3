<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Shinob3</title>

<script>
    EJS_player = "#game";
    EJS_core = "segaMD";
    EJS_gameUrl = "roms/shinob3.bin";
    EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
    EJS_startOnLoaded = true;
    EJS_fullscreenOnLoaded = false;
</script>

<script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

<style>
    html, body {
        margin: 0;
        background: black;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        touch-action: none;
    }

    #game {
        width: 100vw;
        height: 100vh;
    }

    /* Botão de tela cheia */
    #fullscreen-btn {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 20;
        background: rgba(0,0,0,0.6);
        color: white;
        border: 1px solid white;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        display: none;
    }

    /* Tela inicial */
    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        color: white;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 10;
        cursor: pointer;
        border-radius: 12px;
    }

    #overlay span {
        padding: 18px 28px;
        background: #222;
        border: 2px solid white;
        border-radius: 10px;
    }

    #overlay:hover span {
        background: #333;
    }
</style>
</head>

<body>

<div id="overlay">
    <span>▶ TOCAR PARA JOGAR</span>
</div>

<div id="fullscreen-btn">⛶ Tela cheia</div>

<div id="game"></div>

<script>
    const overlay = document.getElementById("overlay");
    const fsBtn = document.getElementById("fullscreen-btn");

    // Entrar em tela cheia
    async function enterFullscreen() {
        const el = document.documentElement;

        if (el.requestFullscreen) {
            try {
                await el.requestFullscreen();
            } catch (e) {
                console.log("Erro ao tentar fullscreen:", e);
            }
        }
    }

    // Atualizar botão conforme o estado da tela
    function updateFullscreenButton() {
        const isFullscreen = document.fullscreenElement != null;
        fsBtn.style.display = isFullscreen ? "none" : "block";
    }

    document.addEventListener("fullscreenchange", updateFullscreenButton);

    // Iniciar jogo
    overlay.addEventListener("click", async () => {
        overlay.remove();
        await enterFullscreen();
        updateFullscreenButton();
    });

    // Botão para entrar novamente em tela cheia
    fsBtn.addEventListener("click", async () => {
        await enterFullscreen();
        updateFullscreenButton();
    });

    // Bloquear rolagem por gestos
    window.addEventListener("touchmove", e => {
        e.preventDefault();
    }, { passive: false });

    // Estado inicial
    updateFullscreenButton();
</script>

</body>
</html>
