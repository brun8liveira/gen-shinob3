<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>shinob3</title>

  <style>
    html, body {
      margin: 0;
      background: black;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* IMPORTANTE: bloqueia o gesto de scroll/zoom em mobile */
      touch-action: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    /* Overlay de toque */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      cursor: pointer;
    }

    /* Botão centralizado */
    #overlay span {
      padding: 18px 28px;
      background: #222;
      border: 2px solid #fff;
      border-radius: 10px;
    }

    #overlay:hover span {
      background: #333;
    }
  </style>

  <script>
    EJS_player = "#game";
    EJS_core = "segaMD";                   // Sega Genesis / Mega Drive
    EJS_gameUrl = "roms/shinob3.bin";     // sua ROM
    EJS_pathtodata = "https://cdn.emulatorjs.org/latest/data/";
    EJS_startOnLoaded = true;
    EJS_fullscreenOnLoaded = false;
  </script>
  <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
</head>
<body>

  <div id="overlay"><span>▶ TOCAR PARA JOGAR</span></div>
  <div id="game"></div>

  <script>
    const overlay = document.getElementById("overlay");

    // Bloqueia rolagem por toque (fallback para navegadores que ignoram touch-action)
    function blockScroll(e) {
      e.preventDefault();
    }
    window.addEventListener('touchmove', blockScroll, { passive: false });

    overlay.addEventListener("click", async () => {
      overlay.remove();

      // Fullscreen dentro do gesto do usuário
      const el = document.documentElement;
      if (el.requestFullscreen) {
        try {
          await el.requestFullscreen();
        } catch (e) {
          console.log("Falha ao entrar em fullscreen:", e);
        }
      }
    });
  </script>

</body>
</html>
