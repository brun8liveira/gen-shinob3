<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Shinobi 3</title>

<!-- CONFIGURAÇÃO EMULATORJS -->
<script>
    EJS_player = "#game";

    // Mega Drive
    EJS_core = "segaMD";

    // ROM
    EJS_gameUrl = "roms/shinob3.bin";

    // Dados locais do EmulatorJS
    EJS_pathtodata = "data/";

    // Identificação exclusiva do jogo
    EJS_gameID = "shinobi3";
    EJS_gameName = "Shinobi 3";

    // Inicialização
    EJS_startOnLoaded = true;
    EJS_fullscreenOnLoaded = false;
</script>

<!-- LOADER LOCAL -->
<script src="data/loader.js"></script>

<style>

    html, body {
        margin: 0;
        background: black;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        touch-action: none;
    }

    /* Área do jogo */
    #game {
        width: 100vw;
        height: 100vh;
    }

    /* Botão de tela cheia */
    #fullscreen-btn {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 20;

        background: rgba(0,0,0,0.6);
        color: white;

        border: 1px solid white;
        border-radius: 6px;

        padding: 6px 10px;
        font-size: 14px;

        cursor: pointer;
        user-select: none;

        display: none;
    }

    /* Tela inicial */
    #overlay {
        position: fixed;
        inset: 0;

        background: rgba(0,0,0,0.85);
        color: white;

        font-size: 26px;

        display: flex;
        align-items: center;
        justify-content: center;

        text-align: center;
        z-index: 10;

        cursor: pointer;
        border-radius: 12px;
    }

    /* Botão iniciar */
    #overlay span {
        padding: 18px 28px;

        background: #222;
        border: 2px solid white;

        border-radius: 10px;
    }

    #overlay:hover span {
        background: #333;
    }

</style>

</head>

<body>

<!-- TELA INICIAL -->
<div id="overlay">
    <span>▶ TOCAR PARA JOGAR</span>
</div>

<!-- BOTÃO FULLSCREEN -->
<div id="fullscreen-btn">
    ⛶ Tela cheia
</div>

<!-- EMULADOR -->
<div id="game"></div>


<script>

    const overlay = document.getElementById("overlay");
    const fsBtn = document.getElementById("fullscreen-btn");


    // ENTRAR EM TELA CHEIA
    async function enterFullscreen() {

        const el = document.documentElement;

        if (el.requestFullscreen) {

            try {
                await el.requestFullscreen();

            } catch (e) {
                console.log("Erro ao tentar fullscreen:", e);
            }

        }
    }


    // ATUALIZAR BOTÃO FULLSCREEN
    function updateFullscreenButton() {

        const isFullscreen =
            document.fullscreenElement != null;

        fsBtn.style.display =
            isFullscreen ? "none" : "block";

    }


    // DETECTAR MUDANÇA DE TELA
    document.addEventListener(
        "fullscreenchange",
        updateFullscreenButton
    );


    // INICIAR JOGO
    overlay.addEventListener("click", async () => {

        overlay.remove();

        await enterFullscreen();

        updateFullscreenButton();

    });


    // BOTÃO PARA ENTRAR NOVAMENTE EM TELA CHEIA
    fsBtn.addEventListener("click", async () => {

        await enterFullscreen();

        updateFullscreenButton();

    });


    // BLOQUEAR ROLAGEM POR GESTOS
    window.addEventListener(
        "touchmove",
        e => e.preventDefault(),
        { passive: false }
    );


    // ESTADO INICIAL
    updateFullscreenButton();

</script>

</body>
</html>
